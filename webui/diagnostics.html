<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResoNet — diagnostyka v1</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101820;color:#edf2f4}
body{max-width:760px;margin:3rem auto;padding:0 1rem}main{background:#1c2a35;border:1px solid #405261;border-radius:12px;padding:1.5rem}
label{display:block;margin:.9rem 0 .3rem}input,button{font:inherit;padding:.7rem;border-radius:6px;border:1px solid #647987}
input{box-sizing:border-box;width:100%;background:#0d151c;color:white}button{margin:.8rem .4rem .2rem 0;background:#245b75;color:white;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d151c;padding:1rem;border-radius:8px;min-height:5rem}
small{color:#c8d5dc}.warning{color:#ffd166}
</style>
</head>
<body><main>
<h1>ResoNet — panel diagnostyczny v1</h1>
<p class="warning">Tryb wyłącznie do odczytu. Ten panel nie steruje wyjściami urządzenia.</p>
<label for="ip">Adres IPv4 urządzenia (sieć prywatna)</label>
<input id="ip" inputmode="decimal" autocomplete="off" placeholder="192.168.1.177">
<label for="token">Token API</label>
<input id="token" type="password" autocomplete="off" placeholder="Wklej token skonfigurowany na serwerze">
<button id="status">Odczytaj status</button><button id="ping">Sprawdź łączność</button>
<pre id="output" aria-live="polite">Brak odczytu.</pre>
<small>Połączenie HTTP do backendu; backend komunikuje się z urządzeniem TCP/5001. Używaj wyłącznie przez HTTPS i w zaufanej sieci.</small>
</main>
<script>
const output=document.getElementById('output');
async function run(action){
 const ip=document.getElementById('ip').value.trim();
 const token=document.getElementById('token').value;
 output.textContent='Oczekiwanie na odpowiedź…';
 try{
  const response=await fetch('diagnostics.php',{method:'POST',headers:{'Content-Type':'application/json','X-Bioresonance-Token':token},body:JSON.stringify({ip,action})});
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.error||'Błąd diagnostyki');
  output.textContent=JSON.stringify(data,null,2);
 }catch(error){output.textContent='Błąd: '+error.message;}
}
document.getElementById('status').addEventListener('click',()=>run('status'));
document.getElementById('ping').addEventListener('click',()=>run('ping'));
</script></body></html>
