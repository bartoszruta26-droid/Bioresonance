name: Desktop protocol v1 host checks

on:
  push:
    branches: [main]
    paths:
      - "gui/include/resonet_protocol_v1.h"
      - "gui/include/network_client.h"
      - "gui/include/types.h"
      - "gui/src/network_client.cpp"
      - "gui/src/gui_app.cpp"
      - "gui/CMakeLists.txt"
      - "gui/tests/network_client_smoke.cpp"
      - "gui/tests/resonet_protocol_v1_smoke.cpp"
      - "bash_tui/**"
      - "webui/diagnostics.php"
      - "webui/diagnostics.html"
      - "webui/index.html"
      - "webui/api.php"
      - "webui/tests/**"
      - "docs/audit/**"
      - ".github/workflows/desktop-protocol.yml"
  pull_request:
    paths:
      - "gui/include/resonet_protocol_v1.h"
      - "gui/include/network_client.h"
      - "gui/include/types.h"
      - "gui/src/network_client.cpp"
      - "gui/src/gui_app.cpp"
      - "gui/CMakeLists.txt"
      - "gui/tests/network_client_smoke.cpp"
      - "gui/tests/resonet_protocol_v1_smoke.cpp"
      - "bash_tui/**"
      - "webui/diagnostics.php"
      - "webui/diagnostics.html"
      - "webui/index.html"
      - "webui/api.php"
      - ".github/workflows/desktop-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile protocol codec with strict warnings
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I gui/include gui/tests/resonet_protocol_v1_smoke.cpp -o protocol_v1_smoke
      - name: Run protocol codec tests
        run: ./protocol_v1_smoke
      - name: Compile desktop network client loopback tests
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -pthread -I gui/include gui/src/network_client.cpp gui/tests/network_client_smoke.cpp -o network_client_smoke
      - name: Run desktop network client tests
        run: ./network_client_smoke
      - name: Run read-only TUI protocol tests
        run: python3 -m unittest discover -s bash_tui -p "test_*.py"
      - name: Run WebUI API contract tests
        run: python3 -m unittest discover -s webui/tests -p "test_*.py"

  desktop-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential qt6-base-dev libqt6charts6-dev
      - name: Configure desktop application and tests
        run: cmake -S gui -B build/gui -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build desktop application and host tests
        run: cmake --build build/gui --parallel
      - name: Run desktop host tests
        run: ctest --test-dir build/gui --output-on-failure

  php-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: sockets
      - name: Lint diagnostics bridge
        run: php -l webui/diagnostics.php && php -l webui/api.php
