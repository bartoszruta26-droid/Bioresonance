name: Firmware protocol host checks

on:
  push:
    branches: [main]
    paths:
      - "ResoNet_Nano/**"
      - "ResoNet_Diagnostic_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  pull_request:
    paths:
      - "ResoNet_Nano/**"
      - "ResoNet_Diagnostic_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-protocol-${{ github.sha }}
  cancel-in-progress: true

jobs:
  protocol-host:
    name: Full protocol codec host tests (not hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n ResoNet_Nano/build_nano.sh ResoNet_Diagnostic_Nano/build.sh
      - name: Compile full protocol codec with strict warnings
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            -I ResoNet_Nano \
            ResoNet_Nano/protocol_v1.cpp tests/host/protocol_v1_test.cpp \
            -o protocol_v1_test
      - name: Run full protocol host tests
        run: ./protocol_v1_test
      - name: Compile Timer1 PWM calculator host tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic -I ResoNet_Nano tests/host/timer1_pwm_calculator_test.cpp -o timer1_pwm_calculator_test
      - name: Run Timer1 PWM calculator host tests
        run: ./timer1_pwm_calculator_test
      - name: Compile integer PWM modulation tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic -I ResoNet_Nano tests/host/modulation_math_test.cpp -o modulation_math_test
      - name: Run integer PWM modulation tests
        run: ./modulation_math_test
      - name: Compile compact diagnostic protocol tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/host/diagnostic_protocol_test.cpp -o diagnostic_protocol_test
      - name: Run compact diagnostic protocol tests
        run: ./diagnostic_protocol_test
      - name: Check diagnostic Nano USB mode and compile sketch
        run: |
          grep -q 'Serial.begin(115200)' ResoNet_Diagnostic_Nano/ResoNet_Diagnostic_Nano.ino
          grep -q 'usb_parser.feed' ResoNet_Diagnostic_Nano/ResoNet_Diagnostic_Nano.ino
          bash -n ResoNet_Diagnostic_Nano/build.sh
      - name: Compile effector resource guard tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic -I ResoNet_Nano tests/host/effector_resource_guard_test.cpp -o effector_resource_guard_test
      - name: Run effector resource guard tests
        run: ./effector_resource_guard_test
      - name: Compile effector presence mask tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/host/effector_presence_test.cpp -o effector_presence_test
      - name: Run effector presence mask tests
        run: ./effector_presence_test
      - name: Compile RAM-only effector runtime tests
        run: g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/host/effector_runtime_test.cpp -o effector_runtime_test
      - name: Run RAM-only effector runtime tests
        run: ./effector_runtime_test

  diagnostic-nano-compile:
    name: Minimal diagnostic Nano compile and size guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and pinned Ethernet library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install EthernetENC@2.0.5
      - name: Compile minimal diagnostic image and enforce memory budget
        run: |
          RESONET_BUILD_DIR="$RUNNER_TEMP/diagnostic-build" RESONET_MAP_FILE="$RUNNER_TEMP/diagnostic-nano.map" bash ResoNet_Diagnostic_Nano/build.sh 2>&1 | tee "$RUNNER_TEMP/diagnostic-nano-build.log"
          flash=$(sed -n 's/Sketch uses \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/diagnostic-nano-build.log" | tail -n 1)
          ram=$(sed -n 's/Global variables use \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/diagnostic-nano-build.log" | tail -n 1)
          test -n "$flash" && test -n "$ram"
          echo "Diagnostic Nano Flash: $flash / 30720 B"
          echo "Diagnostic Nano RAM: $ram / 2048 B"
          test "$flash" -le 20000
          test "$ram" -le 1200
      - name: Upload diagnostic size map and build log
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-nano-size-profile
          path: |
            ${{ runner.temp }}/diagnostic-nano.map
            ${{ runner.temp }}/diagnostic-nano-build.log
          if-no-files-found: error

  arduino-nano-compile:
    name: Full Arduino Nano firmware compile (no hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and pinned Ethernet library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install EthernetENC@2.0.5
      - name: Compile full firmware with Ethernet disabled by default
        run: bash ResoNet_Nano/build_nano.sh
      - name: Compile full firmware with opt-in ENC28J60 TCP and enforce memory budget
        run: |
          set -euo pipefail
          cp -a ResoNet_Nano "$RUNNER_TEMP/ResoNet_Nano"
          sed -i 's/#define RESONET_ENABLE_ETHERNET 0/#define RESONET_ENABLE_ETHERNET 1/' "$RUNNER_TEMP/ResoNet_Nano/network_config.h"
          RESONET_BUILD_DIR="$RUNNER_TEMP/full-build" RESONET_MAP_FILE="$RUNNER_TEMP/full-nano-ethernet.map" bash "$RUNNER_TEMP/ResoNet_Nano/build_nano.sh" 2>&1 | tee "$RUNNER_TEMP/nano-ethernet-build.log"
          flash=$(sed -n 's/Sketch uses \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/nano-ethernet-build.log" | tail -n 1)
          ram=$(sed -n 's/Global variables use \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/nano-ethernet-build.log" | tail -n 1)
          test -n "$flash" && test -n "$ram"
          echo "Full firmware Ethernet Flash: $flash / 30720 B"
          echo "Full firmware Ethernet RAM: $ram / 2048 B"
          test "$flash" -le 28800
          test "$ram" -le 1536
      - name: Upload full firmware size map and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-nano-ethernet-size-profile
          path: |
            ${{ runner.temp }}/full-nano-ethernet.map
            ${{ runner.temp }}/nano-ethernet-build.log
          if-no-files-found: error
