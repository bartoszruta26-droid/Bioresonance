name: Firmware protocol host checks

on:
  push:
    branches: [main]
    paths:
      - "ResoNet_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  pull_request:
    paths:
      - "ResoNet_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-protocol-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  protocol-host:
    name: Protocol codec host tests (not hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            -I ResoNet_Nano \
            ResoNet_Nano/protocol_v1.cpp tests/host/protocol_v1_test.cpp \
            -o protocol_v1_test
      - name: Run protocol host tests
        run: ./protocol_v1_test
  arduino-nano-compile:
    name: Arduino Nano firmware compile (no hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and pinned Ethernet library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install EthernetENC@2.0.5
      - name: Compile Arduino Nano firmware with Ethernet disabled by default
        run: |
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old ResoNet_Nano
      - name: Compile opt-in ENC28J60 TCP transport (no hardware tests)
        run: |
          cp -a ResoNet_Nano "$RUNNER_TEMP/ResoNet_Nano"
          sed -i 's/#define RESONET_ENABLE_ETHERNET 0/#define RESONET_ENABLE_ETHERNET 1/' "$RUNNER_TEMP/ResoNet_Nano/network_config.h"
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old "$RUNNER_TEMP/ResoNet_Nano"
      - name: Diagnostic AVR memory map (temporary analysis)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/nano-build"
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old \
            --build-path "$RUNNER_TEMP/nano-build" \
            --build-property compiler.c.elf.extra_flags="-Wl,--no-check-sections -Wl,-Map=$RUNNER_TEMP/nano.map" \
            ResoNet_Nano || true
          find "$HOME/.arduino15/packages/arduino/tools/avr-gcc" -name avr-nm -type f -exec {} -S --size-sort "$RUNNER_TEMP/nano-build/ResoNet_Nano.ino.elf" \; | tail -n 50 || true
          find "$HOME/.arduino15/packages/arduino/tools/avr-gcc" -name avr-size -type f -exec {} -A "$RUNNER_TEMP/nano-build/ResoNet_Nano.ino.elf" \; || true
