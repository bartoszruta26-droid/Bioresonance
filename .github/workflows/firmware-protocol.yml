name: Firmware protocol host checks

on:
  push:
    branches: [main]
    paths:
      - "ResoNet_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  pull_request:
    paths:
      - "ResoNet_Nano/**"
      - "tests/host/**"
      - ".github/workflows/firmware-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-protocol-${{ github.sha }}
  cancel-in-progress: true

jobs:
  protocol-host:
    name: Protocol codec host tests (not hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            -I ResoNet_Nano \
            ResoNet_Nano/protocol_v1.cpp tests/host/protocol_v1_test.cpp \
            -o protocol_v1_test
      - name: Run protocol host tests
        run: ./protocol_v1_test
  arduino-nano-compile:
    name: Arduino Nano firmware compile (no hardware tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and pinned Ethernet library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install EthernetENC@2.0.5
      - name: Compile Arduino Nano firmware with Ethernet disabled by default
        run: |
          bash ResoNet_Nano/build_nano.sh
      - name: Compile opt-in ENC28J60 TCP transport and enforce memory budget
        run: |
          cp -a ResoNet_Nano "$RUNNER_TEMP/ResoNet_Nano"
          sed -i 's/#define RESONET_ENABLE_ETHERNET 0/#define RESONET_ENABLE_ETHERNET 1/' "$RUNNER_TEMP/ResoNet_Nano/network_config.h"
          bash "$RUNNER_TEMP/ResoNet_Nano/build_nano.sh" 2>&1 | tee "$RUNNER_TEMP/nano-ethernet-build.log"
          flash=$(sed -n 's/Sketch uses \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/nano-ethernet-build.log" | tail -n 1)
          ram=$(sed -n 's/Global variables use \([0-9][0-9]*\) bytes.*/\1/p' "$RUNNER_TEMP/nano-ethernet-build.log" | tail -n 1)
          test -n "$flash" && test -n "$ram"
          test "$flash" -le 28800
          test "$ram" -le 1536
