name: Desktop GUI
on:
  push:
    branches: [main]
    paths: ["gui/**", "webui/**", "bash_tui/**", "android_app/**", "frequencies.md", ".github/workflows/desktop-gui.yml"]
  pull_request:
    paths: ["gui/**", "webui/**", "bash_tui/**", "android_app/**", "frequencies.md", ".github/workflows/desktop-gui.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-gui-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-qt6:
    name: Linux Qt 6 GUI build and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgl1-mesa-dev qt6-base-dev libqt6charts6-dev
      - name: Configure
        run: cmake -S gui -B build/gui -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/gui --parallel
      - name: Test
        run: ctest --test-dir build/gui --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bioresonance-qt6-linux
          path: build/gui/bioresonance_gui
          if-no-files-found: warn
  windows-client-x64:
    name: Windows 10/11 x64 Qt 6 GUI build and tests (self-hosted)
    # GitHub-hosted x64 Windows images are Windows Server, not desktop Windows.
    # Enable after registering a trusted Windows 10/11 x64 self-hosted runner
    # with the custom label "windows-client-x64".
    if: vars.WINDOWS_CLIENT_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, windows-client-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify desktop Windows 10/11 (reject Windows Server)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          if ($os.ProductType -ne 1 -or $os.Caption -notmatch 'Windows 10|Windows 11') {
            throw "This job requires desktop Windows 10 or Windows 11; detected: $($os.Caption)"
          }
          if ([Environment]::Is64BitOperatingSystem -ne $true) {
            throw "This job requires x64 Windows"
          }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S gui -B build/gui -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build/gui --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build/gui -C Release --output-on-failure
  android-app:
    name: Android app build and unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Run Android unit tests and assemble debug APK
        working-directory: android_app
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bioresonance-android-debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
